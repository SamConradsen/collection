<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist - Adidas Arkiv</title>
  <link rel="stylesheet" href="style.css">
  <script>
    const PAGE_MODE = 'wish';
  </script>
</head>
<body>

  <!--- Header Banner --->
  <div class="header-container" id="headerContainer">
    <img src="https://lh3.googleusercontent.com/d/14m-Rprm0BtqaVohizhDgPj0pSlfeIfGy" alt="Wishlist Header">
  </div>

  <!-- Sticky Menu / Navbar -->
  <div class="sticky-menu-wrapper">
    <div class="sticky-menu">
      <div class="menu-left">
        <img src="https://lh3.googleusercontent.com/d/1Rr_zvVAQYIR4N1D4tfpUbryo5eiioUpq" class="menu-item" onclick="handleButtonA()" alt="Back">
        <img src="https://lh3.googleusercontent.com/d/1xmQ_n_7Y_pGltsocKUHVBAHdI6Gm0oes" class="menu-item" onclick="handleButtonB()" alt="Add">
        
        <div class="size-menu-trigger" onclick="toggleSizeMenu(event)">
          <img src="https://lh3.googleusercontent.com/d/1w_wkFOLBDLVanPZDswz19U744f0Dg8EL" class="menu-item" alt="Sizes">
          <div class="size-dropdown" id="sizeDropdown"></div>
        </div>
      </div>

      <div class="menu-center desktop-menu-center">
        <!-- Search Box -->
        <div class="search-box">
          <img src="https://lh3.googleusercontent.com/d/16AEnLeUyzfPU4YTCNXWA78eKpm2aWF4v" class="search-bg-img" alt="Search">
          <input type="text" placeholder="Search..." oninput="handleSearch(this.value)" list="categorySuggestions">
          <datalist id="categorySuggestions"></datalist>
        </div>

        <!-- Brand Filter Buttons (punkt 6) -->
        <div class="brand-filter-group">
          <img id="topBrandOrig" src="https://lh3.googleusercontent.com/d/1phuiZ7Mh7kYKfAENbCw2ah78_Tem2NAM" onclick="toggleBrandFilter('originals')" alt="Originals">
          <img id="topBrandPerf" src="https://lh3.googleusercontent.com/d/1ycABFjAvKvRXOgnKJ77_fO2Y0zpAh6fG" onclick="toggleBrandFilter('performance')" alt="Performance">
        </div>

        <!-- Show Sold Toggle -->
        <div class="toggle-container" onclick="toggleShowSold()">
          <span class="toggle-label">SHOW SOLD</span>
          <img id="showSoldToggleImg" class="menu-item" src="https://lh3.googleusercontent.com/d/1B65f2Et5kHbFkxHI8Q6cN3Uva6Ls0EKZ" alt="Show Sold">
        </div>
      </div>

      <div class="menu-right">
        <!-- Mobile Dropdown Fold Out Button (punkt 7) -->
        <div class="mobile-foldout-trigger" onclick="toggleMobileDropdown(event)">
          <img src="https://lh3.googleusercontent.com/d/1uAKwyD0PDeKZ8p-C4xMuNnaMW314ayjp" class="menu-item" alt="Menu">
          <div class="mobile-dropdown-panel" id="mobileDropdownPanel" onclick="event.stopPropagation()">
            <div class="search-box mobile-search-box">
              <img src="https://lh3.googleusercontent.com/d/16AEnLeUyzfPU4YTCNXWA78eKpm2aWF4v" class="search-bg-img" alt="Search">
              <input type="text" placeholder="Search..." oninput="handleSearch(this.value)" list="categorySuggestions">
            </div>
            
            <div class="mobile-dropdown-row">
              <div class="brand-filter-group">
                <img id="mobBrandOrig" src="https://lh3.googleusercontent.com/d/1phuiZ7Mh7kYKfAENbCw2ah78_Tem2NAM" onclick="toggleBrandFilter('originals')" alt="Originals">
                <img id="mobBrandPerf" src="https://lh3.googleusercontent.com/d/1ycABFjAvKvRXOgnKJ77_fO2Y0zpAh6fG" onclick="toggleBrandFilter('performance')" alt="Performance">
              </div>

              <div class="toggle-container" onclick="toggleShowSold()">
                <span class="toggle-label">SHOW SOLD?</span>
                <img id="mobShowSoldToggleImg" class="menu-item" src="https://lh3.googleusercontent.com/d/1B65f2Et5kHbFkxHI8Q6cN3Uva6Ls0EKZ" alt="Show Sold">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content Layout med Kategori-menu -->
  <div class="main-wrapper">
    <div class="content-area" id="contentArea"></div>
    <div class="alphabet-nav" id="alphabetNav"></div>
  </div>

  <!-- Modal Popup -->
  <div class="modal-bg" id="modalBg" onclick="handleBackdropClick(event)">
    <div class="modal modal-collect" id="modalCard">
      
      <div class="modal-header-banner">
        <img id="modalHeaderImg" src="https://lh3.googleusercontent.com/d/1jDUHm6gbM6adDlhTJVOFNG_MZo8_Xeuy" alt="Header Banner">
      </div>

      <!-- UPLOAD ELEMENT -->
      <div class="upload-section">
        <div class="upload-btn" id="uploadPreview" onclick="document.getElementById('fileInput').click()"></div>
        <input type="file" id="fileInput" style="display:none;" onchange="handleImage(this)">
        
        <div class="upload-right">
          <div class="field-group">
            <label for="mArticle">Article number</label>
            <div class="art-input">
              <img src="https://lh3.googleusercontent.com/d/1k2UAsx1wDDB_nzxmmHjxAotoMZ5BQft1" alt="a#">
              <input type="text" id="mArticle" placeholder="Article number" oninput="markFormDirty()">
            </div>
          </div>

          <div class="brand-toggle">
            <img id="imgOrigToggle" src="https://lh3.googleusercontent.com/d/152SiPw7Y39y_jeMaTdTZLXFkgR_Zu4cn" onclick="selectBrand('originals')" alt="Originals">
            <img id="imgPerfToggle" src="https://lh3.googleusercontent.com/d/1wEklPrdEZ3GHbNw2ejwfYwx1nBnRxhny" onclick="selectBrand('performance')" alt="Performance">
          </div>

          <div class="field-group">
            <label for="mCategory">Category</label>
            <input type="text" id="mCategory" placeholder="Category" list="categorySuggestions" oninput="markFormDirty()">
          </div>
        </div>
      </div>

      <!-- INFORMATION ELEMENT -->
      <div class="info-element-wrapper">
        <div class="field-group">
          <label for="mName">Name</label>
          <input type="text" id="mName" placeholder="Item name" oninput="markFormDirty()">
        </div>

        <div class="three-cols">
          <div class="field-group" style="flex: 1;">
            <label for="mSize">Size</label>
            <input type="text" id="mSize" placeholder="Size" oninput="markFormDirty()">
          </div>
          <div class="field-group" style="flex: 1;">
            <label for="mMadeIn">Made in</label>
            <input type="text" id="mMadeIn" placeholder="Country" oninput="markFormDirty()">
          </div>
          <div class="field-group" style="flex: 1;">
            <label for="mProduced">Production time</label>
            <input type="text" id="mProduced" placeholder="MM/YY" oninput="markFormDirty()">
          </div>
        </div>
      </div>

      <!-- PRICE ELEMENT -->
      <div class="price-section">
        <div class="field-group">
          <label for="mMaterial">Materials</label>
          <textarea id="mMaterial" placeholder="Materials..." oninput="markFormDirty()"></textarea>
        </div>
        <div class="price-right">
          <div class="field-group">
            <label for="mPurchasePrice">Purchase price</label>
            <input type="text" id="mPurchasePrice" placeholder="0,00 kr." oninput="markFormDirty()">
          </div>
          <div class="toggle-sold-row" onclick="toggleSoldState()">
            <img id="btnSold" src="https://lh3.googleusercontent.com/d/1K9HrpK2swbPdadOZPbrPVT3-V7k7bwCK" alt="Reselling">
          </div>
          <div class="field-group sale-price-group" id="salePriceGroup">
            <label for="mSalePrice">Sale price</label>
            <input type="text" id="mSalePrice" placeholder="0,00 kr." disabled oninput="markFormDirty()">
          </div>
        </div>
      </div>

      <!-- FOOTER ELEMENT (punkt 5: Opdaterede Image IDs for Cancel & Save) -->
      <div class="modal-footer">
        <img src="https://lh3.googleusercontent.com/d/1bIswf5T_aL4D3FBBkKJzgrP2c3qv1aUp" class="footer-btn" onclick="closeModal()" alt="Cancel">
        <div class="move-toggle-btn" onclick="toggleModalPageType()">
          <img id="imgMoveBtn" src="https://lh3.googleusercontent.com/d/1G6bh59wDqrV1XJ8tIZsDJniycS4BHwZ_" alt="Move">
        </div>
        <img src="https://lh3.googleusercontent.com/d/18Nxk5H4uAA2pAktW6TkC7l8WEpZVpvZT" class="footer-btn" onclick="saveData()" alt="Save">
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
