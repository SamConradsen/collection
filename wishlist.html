<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist - Adidas Arkiv</title>
  <link rel="stylesheet" href="style.css">
  <script>
    const PAGE_MODE = 'wish';
  </script>
</head>
<body>

  <!-- Header Banner -->
  <div class="header-container">
    <img src="https://lh3.googleusercontent.com/d/14m-Rprm0BtqaVohizhDgPj0pSlfeIfGy" alt="Wishlist Header">
  </div>

  <!-- Sticky Menu / Navbar -->
  <div class="sticky-menu-wrapper">
    <div class="sticky-menu">
      <div class="menu-left">
        <!-- Knap A -->
        <img src="https://lh3.googleusercontent.com/d/1Rr_zvVAQYIR4N1D4tfpUbryo5eiioUpq" class="menu-item" onclick="handleButtonA()" alt="Back">
        <!-- Knap B -->
        <img src="https://lh3.googleusercontent.com/d/1xmQ_n_7Y_pGltsocKUHVBAHdI6Gm0oes" class="menu-item" onclick="handleButtonB()" alt="Add">
        
        <!-- Size Menu Knap -->
        <div class="size-menu-trigger" onclick="toggleSizeMenu(event)">
          <img src="https://lh3.googleusercontent.com/d/1w_wkFOLBDLVanPZDswz19U744f0Dg8EL" class="menu-item" alt="Sizes">
          <div class="size-dropdown" id="sizeDropdown"></div>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="search-box">
        <img src="https://lh3.googleusercontent.com/d/16AEnLeUyzfPU4YTCNXWA78eKpm2aWF4v" class="search-bg-img" alt="Search">
        <input type="text" placeholder="Search..." oninput="handleSearch(this.value)" list="categorySuggestions">
        <datalist id="categorySuggestions"></datalist>
      </div>

      <div class="menu-right">
        <div class="toggle-container" onclick="toggleShowSold()">
          <img id="showSoldToggleImg" class="menu-item" src="https://lh3.googleusercontent.com/d/1B65f2Et5kHbFkxHI8Q6cN3Uva6Ls0EKZ" alt="Show Sold">
          <span class="toggle-label">SHOW SOLD</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content Layout med Sidebar & Gitter -->
  <div class="main-wrapper">
    <div class="content-area" id="contentArea"></div>
    <div class="alphabet-nav" id="alphabetNav"></div>
  </div>

  <!-- Modal Popup -->
  <div class="modal-bg" id="modalBg">
    <div class="modal modal-wishlist" id="modalCard">
      <div class="modal-header-banner">
        <img id="modalHeaderImg" src="" alt="Header Banner">
      </div>

      <div class="upload-section">
        <div class="upload-btn" id="uploadPreview" onclick="document.getElementById('fileInput').click()"></div>
        <input type="file" id="fileInput" style="display:none;" onchange="handleImage(this)">
        
        <div class="upload-right">
          <div class="field-group">
            <label for="mArticle">Article number</label>
            <div class="art-input">
              <img src="https://lh3.googleusercontent.com/d/1k2UAsx1wDDB_nzxmmHjxAotoMZ5BQft1" alt="a#">
              <input type="text" id="mArticle" placeholder="Article number">
            </div>
          </div>
          <div class="brand-toggle">
            <img id="imgOrigToggle" src="" onclick="selectBrand('originals')" alt="Originals">
            <img id="imgPerfToggle" src="" onclick="selectBrand('performance')" alt="Performance">
          </div>
          <div class="field-group">
            <label for="mCategory">Category</label>
            <input type="text" id="mCategory" placeholder="Category" list="categorySuggestions">
          </div>
        </div>
      </div>

      <div class="field-group">
        <label for="mName">Name</label>
        <input type="text" id="mName" placeholder="Item name">
      </div>

      <div class="three-cols">
        <div class="field-group" style="flex: 1;">
          <label for="mSize">Size</label>
          <input type="text" id="mSize" placeholder="Size">
        </div>
        <div class="field-group" style="flex: 1;">
          <label for="mMadeIn">Made in</label>
          <input type="text" id="mMadeIn" placeholder="Country">
        </div>
        <div class="field-group" style="flex: 1;">
          <label for="mProduced">Production time</label>
          <input type="text" id="mProduced" placeholder="MM/YY">
        </div>
      </div>

      <div class="price-section">
        <div class="field-group" style="flex: 1;">
          <label for="mMaterial">Materials</label>
          <textarea id="mMaterial" placeholder="Materials..."></textarea>
        </div>
        <div class="price-right" style="flex: 1;">
          <div class="field-group">
            <label for="mPurchasePrice">Purchase price</label>
            <input type="text" id="mPurchasePrice" placeholder="0,00 kr.">
          </div>
          <div class="toggle-sold-row" onclick="toggleSoldState()">
            <img id="btnSold" src="" alt="Reselling">
          </div>
          <div class="field-group sale-price-group" id="salePriceGroup">
            <label for="mSalePrice">Sale price</label>
            <input type="text" id="mSalePrice" placeholder="0,00 kr." disabled>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <img src="https://lh3.googleusercontent.com/d/1ezJe2_NICuZT07YFN_1pRIQC8yiWAOHc" class="footer-btn" onclick="closeModal()" alt="Cancel">
        <div class="move-toggle-btn" onclick="toggleModalPageType()">
          <img id="imgMoveBtn" src="" alt="Move">
        </div>
        <img src="https://lh3.googleusercontent.com/d/1AjppabQ9us5pA44AK5LGZdV9MJ1YDXrC" class="footer-btn" onclick="saveData()" alt="Save">
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
