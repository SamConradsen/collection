<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adidas Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Responsive Header -->
  <div class="header-container">
    <picture>
      <source media="(max-width: 600px)" srcset="https://lh3.googleusercontent.com/d/1tXXBHPuJkQmTSH0TyjgpW9n7F_LL1qxr">
      <source media="(max-width: 1024px)" srcset="https://lh3.googleusercontent.com/d/1qQomcIrsTLXeJXN2IU-prrFtXvShnsYx">
      <img src="https://lh3.googleusercontent.com/d/1BbO-EU_AmhU8XtYRuYGCFx_ZVZzK3iCA" alt="Collection Header">
    </picture>
  </div>

<!-- Sticky Menu Wrapper -->
  <div class="sticky-menu-wrapper">
    <div class="sticky-menu">
      <div class="menu-left">
        <img src="https://lh3.googleusercontent.com/d/1Rr_zvVAQYIR4N1D4tfpUbryo5eiioUpq" class="menu-item" id="btnA" onclick="openModal('collect')">
        <img src="https://lh3.googleusercontent.com/d/1w_wkFOLBDLVanPZDswz19U744f0Dg8EL" class="menu-item" onclick="toggleSizeMenu()">
      </div>

      <div class="menu-right">
        <div class="toggle-container">
          <span class="toggle-label">SHOW SOLD</span>
          <img src="https://lh3.googleusercontent.com/d/1B65f2Et5kHbFkxHI8Q6cN3Uva6Ls0EKZ" class="menu-item" id="toggleSold" onclick="toggleShowSold()" style="height:32px;">
        </div>

        <div class="search-box">
          <img src="https://lh3.googleusercontent.com/d/16AEnLeUyzfPU4YTCNXWA78eKpm2aWF4v" class="search-bg-img">
          <input type="text" id="searchInput" oninput="renderItems()">
        </div>

        <img src="https://lh3.googleusercontent.com/d/1xmQ_n_7Y_pGltsocKUHVBAHdI6Gm0oes" class="menu-item" onclick="window.location.href='wishlist.html'">
      </div>
    </div>

    <!-- Size Menu Popup placeret direkte under menuen -->
    <div class="size-dropdown" id="sizeDropdown"></div>
  </div>

  <!-- Main Content Layout -->
  <div class="main-wrapper">
    <div class="content-area" id="contentArea"></div>
    <div class="alphabet-nav" id="alphabetNav"></div>
  </div>

<!-- Modal Popup -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalCard">
    <!-- Header Banner -->
    <div class="modal-header-banner">
      <img id="modalHeaderImg" src="https://lh3.googleusercontent.com/d/1dWYclOTMbNctJwKXaqd6GcN5-TYx351e" alt="Header">
    </div>

    <!-- Upload section & Art / Brand / Category -->
    <div class="upload-section">
      <div class="upload-btn" id="uploadPreview" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleImage(this)">
      </div>
      <div class="upload-right">
        <div class="art-input">
          <img src="https://lh3.googleusercontent.com/d/1k2UAsx1wDDB_nzxmmHjxAotoMZ5BQft1" alt="a#">
          <input type="text" id="mArticle" placeholder="Article number">
        </div>

        <div class="brand-toggle">
          <img id="imgOrigToggle" src="https://lh3.googleusercontent.com/d/1DyIHFmCtyFQIfJoQEIKdO2KhdzngxNEy" onclick="setBrand('originals')" alt="Originals">
          <img id="imgPerfToggle" src="https://lh3.googleusercontent.com/d/1Gups0Qilu0Zau09XiGHn4JR98etyR0ZR" onclick="setBrand('performance')" alt="Performance">
        </div>

        <div class="field-group">
          <label>Category</label>
          <input type="text" id="mCategory" list="categorySuggestions" placeholder="Category">
          <datalist id="categorySuggestions"></datalist>
        </div>
      </div>
    </div>

    <!-- Name -->
    <div class="field-group">
      <label>Name</label>
      <input type="text" id="mName" placeholder="Item name">
    </div>

    <!-- Size / Made in / Production time -->
    <div class="three-cols">
      <div class="field-group" style="flex: 1;">
        <label>Size</label>
        <input type="text" id="mSize" placeholder="Size">
      </div>
      <div class="field-group" style="flex: 1.2;">
        <label>Made in</label>
        <input type="text" id="mMadeIn" placeholder="Country">
      </div>
      <div class="field-group" style="flex: 1.5;">
        <label>Production time</label>
        <input type="text" id="mProduced" placeholder="MM/YY">
      </div>
    </div>

    <!-- Materials / Price Section -->
    <div class="price-section">
      <div class="field-group" style="flex: 1.1;">
        <label>Materials</label>
        <textarea id="mMaterial" placeholder="Materials..."></textarea>
      </div>

      <div class="price-right">
        <div class="field-group">
          <label>Purchase price</label>
          <input type="text" id="mPurchasePrice" placeholder="0,00 kr.">
        </div>

        <div class="toggle-sold-row">
          <img id="btnSold" src="https://lh3.googleusercontent.com/d/1K9HrpK2swbPdadOZPbrPVT3-V7k7bwCK" onclick="toggleSoldState()" alt="Reselling">
        </div>

        <div class="field-group">
          <label>Sale price</label>
          <input type="text" id="mSalePrice" placeholder="0,00 kr." disabled>
        </div>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <img src="https://lh3.googleusercontent.com/d/1B65f2Et5kHbFkxHI8Q6cN3Uva6Ls0EKZ" onclick="closeModal()" alt="Cancel" class="footer-btn">
      
      <div class="move-toggle-btn" onclick="toggleModalPageType()">
        <img id="imgMoveBtn" src="https://lh3.googleusercontent.com/d/1fJBy15xDCzGyYaRVC7kuffylkNr8L-6m" alt="Move Item">
      </div>

      <img src="https://lh3.googleusercontent.com/d/19wTkumBvqWSzhakI3TRw6ACWI0jl2YCG" onclick="saveData()" alt="Save" class="footer-btn">
    </div>
  </div>
</div>

  <script src="app.js"></script>
  <script>
    const PAGE_MODE = "collect";
  </script>
</body>
</html>
